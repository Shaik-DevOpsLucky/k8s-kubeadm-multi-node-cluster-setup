apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      containers:
        - name: nodejs
          image: node:18-alpine
          command: ["node", "-e", "require('http').createServer((req,res)=>res.end('Hello Node!')).listen(80)"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-service
spec:
  selector:
    app: nodejs
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
